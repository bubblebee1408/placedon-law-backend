<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placedon — currency check</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{--ink:#0A0A0A;--parch:#F5F3EF;--slate:#475569;--caution:#8B4513;--rule:#D8D4CC}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--parch)}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
  h1{margin:0;font-size:14px;letter-spacing:.02em}
  .sub{color:var(--slate);font-size:11px;margin-top:3px}
  main{padding:12px 16px 24px}
  button{font:inherit;padding:8px 14px;border:1px solid var(--ink);background:var(--ink);
         color:#fff;border-radius:3px;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  .meta{font-size:11px;color:var(--slate);margin:10px 0}
  section{margin-top:18px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;
     color:var(--slate)}
  .row{border-left:3px solid var(--rule);padding:8px 10px;margin-bottom:8px;background:#fff}
  .row.superseded{border-left-color:var(--caution)}
  .row.cannot{border-left-color:var(--slate)}
  .row.ok{border-left-color:#7a9a7a}
  .duty{font-weight:600}
  .prov{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--slate)}
  .detail{margin-top:4px;font-size:12px}
  .ref{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--caution)}
  .empty{color:var(--slate);font-size:12px;font-style:italic}
  .err{border-left:3px solid var(--caution);padding:8px 10px;background:#fff;font-size:12px}
  details summary{cursor:pointer;font-size:11px;color:var(--slate)}
  hr{border:0;border-top:1px solid var(--rule);margin:22px 0 0}
  .chip{display:block;background:#fff;border:1px solid var(--rule);border-left:3px solid var(--slate);
        padding:6px 9px;margin-bottom:6px}
  .chip .k{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
  .chip .v{font-weight:600;font-size:14px}
  .chip .b{font-size:11px;color:var(--caution);margin-top:3px;line-height:1.4}
  .cin{font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .cin.bad{color:var(--caution)}
  .who{font-size:12px;margin-bottom:4px}
  .who .r{display:inline-block;min-width:112px;color:var(--slate);font-size:11px;
          text-transform:uppercase;letter-spacing:.05em}
  .head{font-weight:600;font-size:13px;margin-bottom:8px}
  .head.blocking{color:var(--caution)}
  .cov{background:#fff;border:1px solid var(--rule);border-left:3px solid var(--caution);
       padding:10px 12px;margin-bottom:14px}
  .cov .k{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
  .cov .v{font-weight:600;font-size:13px;margin-top:2px}
  .cov .b{font-size:12px;margin-top:6px;line-height:1.45}
  .gap{font-size:12px;margin-top:5px;padding-left:2px}
</style>
</head>
<body>
<header>
  <h1>Currency check</h1>
  <div class="sub">Is the law this document relies on still the law?</div>
</header>
<main>
  <button id="run" disabled>Check this document</button>
  <div class="meta" id="meta">Loading Office…</div>
  <div id="out"></div>

  <hr>
  <section>
    <h2>Register strip</h2>
    <div class="sub" style="margin-bottom:10px">Who is this document about, and what
      does the register say? No register is wired — paste one to reconcile against it.</div>
    <button id="runstrip" disabled>Read the parties</button>
    <details style="margin-top:10px">
      <summary>Paste a register (optional)</summary>
      <textarea id="reg" rows="6" style="width:100%;font:11px ui-monospace,Menlo,monospace;
        margin-top:6px" placeholder='[{"cin":"U72200KA2021PTC145892","fetched_at":"2026-09-12","source":"portal, hand-entered","values":{"charges":[],"authorised_capital":50000000},"classes":[{"name":"equity","nominal_per_share":10,"authorised_rupees":40000000,"issued_rupees":32000000}]}]'></textarea>
    </details>
    <div id="stripout"></div>
  </section>
</main>
<script src="taskpane.js"></script>
</body>
</html>
