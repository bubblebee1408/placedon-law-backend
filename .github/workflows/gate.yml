# The repository gate on every pull request and every push to main.
#
# 1. scripts/run_tests.sh -- every self-testing suite, keyless, no network, no database.
#    Its HARNESS_RESULT line decides; a suite that prints no count fails it.
# 2. The live-database regressions that the gate only checks offline, against a real
#    PostgreSQL 16 with FORCE ROW LEVEL SECURITY applied by the repository's migrations.
#    Each creates and drops its own placedon_throwaway_* database.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only-not-a-secret
      PLACEDON_PGHOST: localhost
      PLACEDON_PG_ADMIN: postgres
      PLACEDON_PG_APP: placedon_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-gateway.txt
      - name: Repository gate
        run: bash scripts/run_tests.sh
      - name: Application role (NOSUPERUSER NOBYPASSRLS, as in production)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE placedon_app LOGIN PASSWORD 'ci-only-not-a-secret' NOSUPERUSER NOBYPASSRLS"
      - name: Live-database regressions
        # A provisioning failure prints SKIP and exits 0 locally, by design. Here it would
        # be a green check over nothing, so SKIP or a missing "N/M passed" line fails.
        run: |
          set -euo pipefail
          for s in scripts/vault_upload_atomic_integration.py \
                   scripts/vault_failed_retry_integration.py \
                   scripts/conversation_persist_integration.py; do
            echo "::group::$s --run"
            out=$(PYTHONPATH=. python "$s" --run 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            echo "::endgroup::"
            if grep -q '^SKIP' <<<"$out" || ! grep -qE '[0-9]+/[0-9]+ passed' <<<"$out"; then
              echo "::error::$s did not run against the database"; exit 1
            fi
          done
