# The repository gate on every pull request and every push to main.
#
# 1. scripts/run_tests.sh -- every self-testing suite, keyless, no network, no database.
#    Its HARNESS_RESULT line decides; a suite that prints no count fails it.
# 2. The live-database regressions that the gate only checks offline, against a real
#    PostgreSQL 16 with FORCE ROW LEVEL SECURITY applied by the repository's migrations.
#    Each creates and drops its own placedon_throwaway_* database.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: local-only-not-a-secret
      PLACEDON_PGHOST: localhost
      PLACEDON_PG_ADMIN: postgres
      PLACEDON_PG_APP: placedon_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-gateway.txt
      - name: Repository gate
        run: bash scripts/run_tests.sh
      - name: Application role (NOSUPERUSER NOBYPASSRLS, as in production)
        # The same file the local stack runs (compose.yaml), so CI and a laptop agree.
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ops/dev/initdb/10-app-role.sql
      - name: Live-database regressions and the row-level security proof
        run: bash scripts/db_regressions.sh
