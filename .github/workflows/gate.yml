# The repository gate on every pull request and every push to main.
#
# 1. scripts/run_tests.sh -- every self-testing suite, keyless, no network, no database.
#    Its HARNESS_RESULT line decides; a suite that prints no count fails it.
# 2. The live-database regressions that the gate only checks offline, against a real
#    PostgreSQL 16 with FORCE ROW LEVEL SECURITY applied by the repository's migrations.
#    Each creates and drops its own placedon_throwaway_* database.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only-not-a-secret
      PLACEDON_PGHOST: localhost
      PLACEDON_PG_ADMIN: postgres
      PLACEDON_PG_APP: placedon_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-gateway.txt
      - name: Repository gate
        run: bash scripts/run_tests.sh
      - name: Application role (NOSUPERUSER NOBYPASSRLS, as in production)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE placedon_app LOGIN PASSWORD 'ci-only-not-a-secret' NOSUPERUSER NOBYPASSRLS"
      - name: Live-database regressions
        # A provisioning failure prints SKIP and exits 0 locally, by design. Here it would
        # be a green check over nothing, so SKIP or a missing "N/M passed" line fails.
        run: |
          set -euo pipefail
          for s in scripts/vault_upload_atomic_integration.py \
                   scripts/vault_failed_retry_integration.py \
                   scripts/vault_ingest_authz_integration.py \
                   scripts/conversation_persist_integration.py \
                   scripts/review_table_list_integration.py \
                   scripts/company_profile_integration.py \
                   scripts/login_email_integration.py; do
            echo "::group::$s --run"
            out=$(PYTHONPATH=. python "$s" --run 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            echo "::endgroup::"
            if grep -q '^SKIP' <<<"$out" || ! grep -qE '[0-9]+/[0-9]+ passed' <<<"$out"; then
              echo "::error::$s did not run against the database"; exit 1
            fi
          done
      - name: Row-level security proof (scripts/rls_integration.py)
        # Migrations applied as the superuser; every visibility assertion runs as
        # placedon_app. --run refuses any database not named placedon_throwaway_*.
        env:
          PLACEDON_ADMIN_DATABASE_URL: postgresql://localhost/placedon_throwaway_rls?user=postgres
          PLACEDON_DATABASE_URL: postgresql://localhost/placedon_throwaway_rls?user=placedon_app
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE placedon_throwaway_rls"
          out=$(PYTHONPATH=. python scripts/rls_integration.py --run 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q '^  REFUSED:' <<<"$out" || ! grep -qE '^[0-9]+/[0-9]+ passed' <<<"$out"; then
            echo "::error::rls_integration.py did not run against the database"; exit 1
          fi
          psql -h localhost -U postgres -c "DROP DATABASE placedon_throwaway_rls WITH (FORCE)"
